# sparkrun recipe: Qwen3.8-Flash-Next NVFP4 (Abliterated) on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark
model: dealignai/Qwen3.8-Flash-Next-ABLITERATED-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:20260926
min_nodes: 1
max_nodes: 1
metadata:
  description: "Qwen3.8-Flash-Next Abliterated NVFP4 on single DGX Spark — MTP speculative draft, 256k context"
  category: general
  model_params: 8000000000
  model_dtype: nvfp4
  kv_dtype: fp8_e5m2
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  enforce_eager: false
env:
  HF_TOKEN: "${HF_TOKEN:-}"
  ABLIT: "1"
