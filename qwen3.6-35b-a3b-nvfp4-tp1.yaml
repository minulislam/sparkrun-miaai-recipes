# sparkrun recipe: Qwen3.6-35B-A3B NVFP4 via vLLM on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Qwen3.6-35B-A3B-NVFP4-vLLM
model: unsloth/Qwen3.6-35B-A3B-NVFP4
runtime: vllm
container: vllm/vllm-openai:v0.24.0
min_nodes: 1
max_nodes: 1
metadata:
  description: "Unsloth Qwen3.6-35B-A3B NVFP4 via vLLM on single DGX Spark"
  category: general
  model_params: 35000000000
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 262144
