# sparkrun recipe: Hy3-295B NVFP4 W4A16 via vLLM on 2x DGX Spark (TP=2)
# Source: https://github.com/MiaAI-Lab/Hy3-Dual-DGX-Spark
model: kodelow/Hy3-NVFP4-W4A16
runtime: vllm
container: ghcr.io/miaai-lab/hy3-dual-dgx-spark:vllm-probe-modded
min_nodes: 2
max_nodes: 2
metadata:
  description: "KodeloW Hy3-295B NVFP4 W4A16 via vLLM on 2x DGX Spark — TP=2, tool calling"
  category: general
  model_params: 295000000000
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 2
  gpu_memory_utilization: 0.9
