# sparkrun recipe: GLM-5.3 Flash NVFP4 (Abliterated) on 2x DGX Spark (TP=2)
# Source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-NVFP4-Dual-DGX-Spark
model: dealignai/GLM-5.3-Flash-UNCENSORED-NVFP4
runtime: vllm
container: mia/glm53-flash-spark:mm-ray-v1
min_nodes: 2
max_nodes: 2
metadata:
  description: "GLM-5.3-Flash NVFP4 Abliterated/Uncensored on 2x DGX Spark — Ray TP=2, FP8 KV"
  category: multimodal
  model_params: 92000000000
  model_dtype: nvfp4
  kv_dtype: fp8_e5m2
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 2
  gpu_memory_utilization: 0.9
  max_model_len: 262144
  enforce_eager: true
env:
  HF_TOKEN: "${HF_TOKEN:-}"
  ABLIT: "1"
