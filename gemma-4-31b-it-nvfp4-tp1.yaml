# sparkrun recipe: NVIDIA Gemma-4-31B-IT NVFP4 via vLLM on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Gemma-4-31B-IT-NVFP4-Recipe
model: nvidia/Gemma-4-31B-IT-NVFP4
runtime: vllm
container: vllm/vllm-openai:v0.25.1
min_nodes: 1
max_nodes: 1
metadata:
  description: "NVIDIA Gemma-4-31B-IT-NVFP4 via vLLM with MTP speculative decoding — tool calling, thinking/reasoning support"
  category: general
  model_params: 31000000000
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
