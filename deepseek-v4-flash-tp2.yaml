# sparkrun recipe: DeepSeek-V4-Flash (Abliterated) vLLM on 2x DGX Spark (TP=2)
# Source: https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-0731-vLLM-Dual-DGX-Sparks
model: drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-Anchored-Tensors
runtime: vllm
min_nodes: 2
max_nodes: 2
metadata:
  description: "DeepSeek V4 Flash MoE Abliterated/Uncensored on 2x DGX Spark via vLLM — TP=2, FP8 KV cache, 1M context"
  category: general
  model_params: 236000000000
  model_dtype: bfloat16
  kv_dtype: fp8_e5m2
  quantization: fp8
  quant_bits: 8
defaults:
  port: 8888
  tensor_parallel: 2
  gpu_memory_utilization: 0.9
  max_model_len: 1048576
env:
  HF_TOKEN: "${HF_TOKEN:-}"
  ABLITERATED: "1"
