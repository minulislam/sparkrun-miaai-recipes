# sparkrun recipe: Ling-3.0 Flash INT4 via SGLang/DSpark on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Ling-3.0-Flash-SGLang-DSpark-DGX-Spark
model: inclusionAI/Ling-3.0-flash-int4
runtime: sglang
min_nodes: 1
max_nodes: 1
metadata:
  description: "inclusionAI/Ling-3.0-flash-int4 via SGLang on DGX Spark — DSpark speculative decoding, OpenAI-compatible"
  category: general
  model_params: 3000000000
  model_dtype: int4
  quantization: gguf
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
